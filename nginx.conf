server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # 1. CRUCIAL: Tells Nginx how to map file extensions (.js, .css) to correct MIME types
        include /etc/nginx/mime.types;

        # 2. Helps React Router handle client-side deep linking
        try_files $uri $uri/ /index.html;
    }
}