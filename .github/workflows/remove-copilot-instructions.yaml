name: Remove copilot-instructions.md

on:
  push:
    branches:
      - staging

# 1. Grant permissions to allow pushing code back to the repo
permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetches the actual branch instead of a detached HEAD
          ref: staging 

      # 2. Configure Git identity so GitHub knows who is committing
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3. Check if file exists, delete it, and push using [skip ci]
      - name: Remove copilot-instructions.md
        run: |
          if [ -f ".github/copilot-instructions.md" ]; then
            echo "File found. Removing..."
            git rm .github/copilot-instructions.md
            
            # '[skip ci]' in the message prevents this commit from triggering this workflow again
            git commit -m "chore: remove copilot-instructions.md [skip ci]"
            git push origin staging
          else
            echo "File not found. Nothing to remove."
          fi