name: PR Cleanup - Remove Copilot Instructions

on:
  pull_request:
    branches:
      - staging
    types: [opened, synchronize, reopened]

jobs:
  remove-copilot-file:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      # 1. Checkout the specific head branch of the Pull Request
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      # 2. Check for the file and delete it if it exists
      - name: Detect and Delete Copilot File
        id: delete_file
        run: |
          DELETED=false
          
          # Target both root and .github folder locations
          if [ -f "copilot-instructions.md" ]; then
            rm "copilot-instructions.md"
            DELETED=true
          fi
          if [ -f ".github/copilot-instructions.md" ]; then
            rm ".github/copilot-instructions.md"
            DELETED=true
          fi
          
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT

      # 3. Commit the deletion back to the PR branch
      - name: Commit Deletion
        if: steps.delete_file.outputs.deleted == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "chore: remove copilot-instructions before staging merge"
          git push